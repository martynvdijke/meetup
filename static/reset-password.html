<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="/tailwind.css"></head>
<body class="antialiased">
<div class="max-w-[520px] mx-auto my-[60px] px-4">
<div class="glass card-pad">
<h1 class="font-bold text-[1.4rem]">Reset password</h1>
<form id="form-reset" class="mt-4 grid gap-3">
<div class="field"><label for="rp-pass">New password</label><input id="rp-pass" class="input" type="password" required minlength="8"></div>
<div class="field"><label for="rp-pass2">Confirm password</label><input id="rp-pass2" class="input" type="password" required minlength="8"></div>
<button class="btn btn-primary" type="submit">Reset password</button>
<div id="rp-msg" class="text-[#9AA0B8] text-[0.88rem]"></div>
</form>
</div>
</div>
<script>
(function(){
  var qs=new URLSearchParams(location.search);
  var token=qs.get('token')||'';
  var msg=document.getElementById('rp-msg');
  if(!token){msg.textContent='Missing token.'; msg.style.color='#F87171'; return;}
  fetch('/api/auth/reset/validate?token='+encodeURIComponent(token)).then(function(r){
    if(!r.ok) throw new Error('invalid');
  }).catch(function(){ msg.textContent='Invalid or expired token.'; msg.style.color='#F87171'; });
  document.getElementById('form-reset').addEventListener('submit',function(e){
    e.preventDefault();
    var p=document.getElementById('rp-pass').value;
    var p2=document.getElementById('rp-pass2').value;
    if(p!==p2){msg.textContent='Passwords do not match'; msg.style.color='#F87171'; return;}
    fetch('/api/auth/reset',{method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:token,password:p})}).then(function(r){
      if(!r.ok) return r.json().then(function(j){ throw new Error(j.error||'Failed'); });
      msg.textContent='Password reset successful. You can now login.'; msg.style.color='#4ADE80';
      setTimeout(function(){ location.href='/admin'; },1200);
    }).catch(function(err){ msg.textContent=err.message; msg.style.color='#F87171'; });
  });
})();
</script>
</body></html>
